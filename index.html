<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Domain Awakening</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Loading Screen -->

<div id="loading">

<h1>DOMAIN AWAKENING</h1>

<p>Preparing your realm...</p>

<div class="loader"></div>

</div>

<!-- Main Menu -->

<section id="menu" class="hidden">

<h1 class="title">

Choose Your Domain

</h1>

<p class="subtitle">

Power awaits those who step beyond fear.

</p>

<div class="buttons">

<button id="blueBtn">

🔵 Infinity Realm

</button>

<button id="redBtn">

🔴 Crimson Shrine

</button>

</div>

</section>

<!-- Animation Screen -->

<section id="domainScreen" class="hidden">

<div id="flash"></div>

<div id="fog"></div>

<div id="particles"></div>

<div id="rings"></div>

<div id="lightning"></div>

<h1 id="domainTitle"></h1>

<p id="quote"></p>

<button id="replay">

Replay

</button>

</section>

<script src="script.js"></script>

</body>
</html>
